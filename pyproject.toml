[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "catagorize"
version = "0.1.8"
description = "特定文件夹整理工具：体检 / 规则整理 / 指纹去重 / 全文检索，文件原地不动"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.3",
    "windows-toasts>=1.3",
    "pywin32>=308",
    "PySide6-Essentials>=6.6",
    "PySideSix-Frameless-Window>=0.8",
    "darkdetect",
    "PySide6-Fluent-Widgets>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
